<div style="position: fixed; inset: 0; z-index: 50; overflow-y: auto; padding: 24px; box-sizing: border-box; background: rgba(8, 10, 16, 0.55); display: flex; align-items: center; justify-content: center" class="dc-overlay">
<form role="dialog" aria-modal="true" aria-labelledby="dlg-title" style="width: 560px; box-sizing: border-box; background: var(--c-ffffff); border-radius: 28px; padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.28); margin: auto;" method="post" action="/account/email" novalidate="">
<h2 id="dlg-title" style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 400; text-align: left">Alterar e-mail</h2>
<div style="display: flex; flex-direction: column">
<div style="position: relative; height: 56px; box-sizing: border-box; border: 2px solid var(--c-4453c9); border-radius: 4px; display: flex; align-items: center" class="dc-field" data-error="{{ 'true' if errs.get('email') else 'false' }}">
<label for="f-email" style="position: absolute; top: -9px; left: 12px; padding: 0 4px; background: var(--c-ffffff); font-size: 12px; line-height: 16px; color: var(--c-4453c9)">Novo e-mail</label>
<input id="f-email" name="email" type="email" autocomplete="email" value="{{ values.email }}" style="border: 0; outline: none; background: transparent; width: 100%; height: 100%; box-sizing: border-box; padding: 0 15px; font-size: 16px; color: var(--c-1b1c22)">
</div>{% if errs.get('email') %}<div role="alert" style="display: flex; gap: 8px; align-items: flex-start; padding: 8px 0 0 2px; font-size: 13px; line-height: 18px; color: var(--c-b3261e)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: var(--c-b3261e)"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg><span>{{ errs.get('email') }}</span></div>{% endif %}

</div><div style="display: flex; flex-direction: column">
<div style="position: relative; height: 56px; box-sizing: border-box; border: 1px solid var(--c-747785); border-radius: 4px; display: flex; align-items: center" class="dc-field" data-error="{{ 'true' if errs.get('pwd') else 'false' }}">
<label for="f-pwd" style="position: absolute; top: -9px; left: 12px; padding: 0 4px; background: var(--c-ffffff); font-size: 12px; line-height: 16px; color: var(--c-4a4d5a)">Senha atual</label>
<input id="f-pwd" name="pwd" type="password" autocomplete="current-password" style="border: 0; outline: none; background: transparent; width: 100%; height: 100%; box-sizing: border-box; padding: 0 15px; font-size: 16px; color: var(--c-1b1c22)">
</div>
{% if not errs.get('pwd') %}<div style="font-size: 12px; line-height: 16px; color: var(--c-4a4d5a); padding: 4px 16px 0">Confirme sua senha para alterar o e-mail.</div>{% endif %}{% if errs.get('pwd') %}<div role="alert" style="display: flex; gap: 8px; align-items: flex-start; padding: 4px 0 0 16px; font-size: 13px; line-height: 18px; color: var(--c-b3261e)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: var(--c-b3261e)"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg><span>{{ errs.get('pwd') }}</span></div>{% endif %}
</div>
<div style="display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding-top: 8px"><a href="/account" style="display: inline-flex; align-items: center; height: 44px; padding: 0 16px; border-radius: 22px; color: var(--c-4453c9); font-size: 14px; font-weight: 600; text-decoration: none; background: transparent; border: 0" data-cancel="">Cancelar</a><button type="submit" style="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 22px; border-radius: 20px; background: var(--c-4453c9); color: var(--c-fffffe); font-size: 14px; font-weight: 600; text-decoration: none; box-sizing: border-box; cursor: pointer; font-family: inherit; border: 0">Salvar</button></div>
</form>
</div>
