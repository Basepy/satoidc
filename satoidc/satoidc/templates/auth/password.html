{% extends "base.html" %}
{% block title %}Entrar | SatOIDC{% endblock %}
{% block content %}
<div style="width: 100%; min-height: 100vh; box-sizing: border-box; background: var(--c-f0f2f8); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px" class="dc-root">
<form method="post" action="/login/password" style="width: min(1040px, calc(100% - 32px)); min-height: 420px; box-sizing: border-box; background: var(--c-ffffff); border-radius: 28px; padding: 40px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 48px; margin: 0" class="dc-card"><input type="hidden" name="redirect_to" value="{{ redirect_to }}"><input type="hidden" name="login_nonce" value="{{ login_nonce }}">
<div style="display: flex; flex-direction: column; gap: 16px" class="dc-left">
<img src="{{ url_for('static', path='/img/satoidc-logo.png') }}" alt="SatOIDC" style="width: 48px; height: 48px; display: block" class="dc-logo"><h1 style="margin: 16px 0 0; font-size: 36px; line-height: 44px; font-weight: 400; letter-spacing: -0.2px" class="dc-h1">Bem-vindo</h1><a href="/login?redirect_to={{ redirect_to_encoded }}" aria-label="Trocar de conta" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px 0 4px; border: 1px solid var(--c-747785); border-radius: 17px; color: var(--c-1b1c22); font-size: 14px; font-weight: 500; text-decoration: none"><span style="display: flex; width: 26px; height: 26px; border-radius: 13px; background: var(--c-e4e7fb); align-items: center; justify-content: center; color: var(--c-4453c9); font-size: 13px; font-weight: 700">{{ (identifier[:1] or 'S')|upper }}</span>{{ identifier }}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></a>
</div>
<div style="display: flex; flex-direction: column; gap: 24px; padding-top: 64px" class="dc-right">
<div style="display: flex; flex-direction: column">
<div style="position: relative; height: 56px; box-sizing: border-box; border: 2px solid {{ 'var(--c-b3261e)' if err else 'var(--c-4453c9)' }}; border-radius: 4px; display: flex; align-items: center" class="dc-field">
<label for="f-password" style="position: absolute; top: -9px; left: 12px; padding: 0 4px; background: var(--c-ffffff); font-size: 12px; line-height: 16px; color: {{ 'var(--c-b3261e)' if err else 'var(--c-4453c9)' }}">Digite sua senha</label>
<input id="f-password" name="password" type="password" autocomplete="current-password" style="border: 0; outline: none; background: transparent; width: 100%; height: 100%; box-sizing: border-box; padding: 0 15px; font-size: 16px; color: var(--c-1b1c22)" autofocus="" required="">
</div>
{% if err %}
<div role="alert" style="display: flex; gap: 8px; align-items: flex-start; padding: 8px 0 0 2px; font-size: 13px; line-height: 18px; color: var(--c-b3261e)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: var(--c-b3261e)"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg><span>{{ err_text }}</span></div>
{% endif %}
</div>
<label style="display: flex; align-items: center; gap: 12px; font-size: 14px; cursor: pointer; margin-top: -8px">
<input type="checkbox" style="width: 18px; height: 18px; accent-color: var(--c-4453c9); margin: 0" data-toggle-password="#f-password">Mostrar senha</label>

<div style="display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: auto; padding-top: 16px" class="dc-actions">
<a href="/login/lightning?redirect_to={{ redirect_to_encoded }}" style="display: inline-flex; align-items: center; height: 44px; padding: 0 16px; border-radius: 22px; color: var(--c-4453c9); font-size: 14px; font-weight: 600; text-decoration: none; background: transparent; border: 0">Usar carteira Lightning</a><button type="submit" style="display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 24px; border-radius: 22px; background: var(--c-4453c9); color: var(--c-fffffe); font-size: 14px; font-weight: 600; text-decoration: none; border: 0; box-sizing: border-box; cursor: pointer; font-family: inherit">Entrar</button>
</div>
</div>
</form>
<footer style="width: min(1040px, calc(100% - 32px)); display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--c-4a4d5a)" class="dc-foot">
<button type="button" style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px; border: 0; background: transparent; color: var(--c-4a4d5a); font-family: inherit; font-size: 13px; border-radius: 6px">Português (Brasil)<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
<nav style="display: flex; gap: 8px">
<a href="#" style="color: var(--c-4a4d5a); text-decoration: none; padding: 8px 10px">Ajuda</a>
<a href="#" style="color: var(--c-4a4d5a); text-decoration: none; padding: 8px 10px">Privacidade</a>
<a href="#" style="color: var(--c-4a4d5a); text-decoration: none; padding: 8px 10px">Termos</a>
</nav>
</footer>
</div>
{% endblock %}
