<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>{% block title %}SatOIDC{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', path='/img/satoidc-logo.png') }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', path='/css/theme.css') }}" />
  </head>
  <body>
    {% block content %}{% endblock %}
    <script src="{{ url_for('static', path='/js/qrcode.js') }}"></script>
    <script src="{{ url_for('static', path='/js/app.js') }}"></script>
  </body>
</html>
