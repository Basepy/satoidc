<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}SatOIDC{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <a class="brand" href="/">
          <span class="brand-mark">&#9889;</span>
          <span>SatOIDC</span>
        </a>
        <nav class="nav-actions" aria-label="Navegacao principal">
          {% if request.session.get('user_id') %}
            <a class="button secondary" href="/create_client">Novo client</a>
            <a class="button outline" href="/logout">Sair</a>
          {% else %}
            <a class="button secondary" href="/login">Entrar</a>
            <a class="button" href="/register">Criar conta</a>
          {% endif %}
        </nav>
      </header>

      <main>
        {% block content %}{% endblock %}
      </main>
    </div>
    <script src="{{ url_for('static', path='/js/app.js') }}"></script>
  </body>
</html>
